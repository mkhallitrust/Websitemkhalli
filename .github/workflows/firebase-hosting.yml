# Publishes the website to Firebase Hosting on every push to main,
# and gives every pull request a temporary preview link.
# One-time setup: run `firebase init hosting:github` (it creates the
# FIREBASE_SERVICE_ACCOUNT secret in this GitHub repository for you).
# The payment server (functions/) is deployed by hand: `firebase deploy --only functions`.
name: Deploy website to Firebase Hosting

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: mkhalli
          channelId: ${{ github.event_name == 'push' && 'live' || '' }}
